name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        run: |
          VERSION=$(awk -F'"' '/^const MCPVersion = / {print $2; exit}' internal/mcp/server.go)
          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid MCPVersion in internal/mcp/server.go: $VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "CHANGELOG.md missing section for $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fetch tags
        run: git fetch --tags

      - name: Verify version metadata sync
        run: |
          bash scripts/sync-version-from-server.sh
          git diff --exit-code README.md docs/mcp-openapi.yaml

      - name: Create tag if missing
        id: tag
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        if: steps.tag.outputs.exists != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        if: steps.tag.outputs.exists != 'true'
        run: |
          GOOS=linux GOARCH=amd64 go build -o mcp-server-linux-amd64 ./cmd/server/main.go
          GOOS=darwin GOARCH=amd64 go build -o mcp-server-darwin-amd64 ./cmd/server/main.go
          GOOS=windows GOARCH=amd64 go build -o mcp-server-windows-amd64.exe ./cmd/server/main.go

      - name: Create archives
        if: steps.tag.outputs.exists != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          tar -czf database-mcp-server_${VERSION}_linux_amd64.tar.gz mcp-server-linux-amd64
          tar -czf database-mcp-server_${VERSION}_darwin_amd64.tar.gz mcp-server-darwin-amd64
          zip -q database-mcp-server_${VERSION}_windows_amd64.zip mcp-server-windows-amd64.exe

      - name: Extract changelog notes
        if: steps.tag.outputs.exists != 'true'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
            BEGIN { in_block=0 }
            $0 ~ "^## \\["version"\\]" {
              if (in_block) exit
              in_block=1
              next
            }
            $0 ~ "^## \\[" && in_block { exit }
            in_block { print }
          ' CHANGELOG.md > release-notes.md

      - name: Publish GitHub release
        if: steps.tag.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: |
            database-mcp-server_${{ steps.version.outputs.version }}_linux_amd64.tar.gz
            database-mcp-server_${{ steps.version.outputs.version }}_darwin_amd64.tar.gz
            database-mcp-server_${{ steps.version.outputs.version }}_windows_amd64.zip
          body_path: release-notes.md
