name: Publish Container Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (example: v1.0.7)"
        required: true
        type: string
      publish_latest:
        description: "Also publish :latest"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  publish-ghcr:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$DISPATCH_TAG"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi

          if ! echo "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Unsupported tag format: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_no_v=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.version }}

      - name: Capture source revision
        id: git
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Ensure Dockerfile compatibility for legacy tags
        run: |
          # Keep the checked-in Dockerfile when it doesn't require optional pkg/.
          if [ -f Dockerfile ] && ! grep -Eq 'COPY[[:space:]]+pkg[[:space:]]+\./pkg' Dockerfile; then
            exit 0
          fi

          # Keep the checked-in Dockerfile when pkg/ exists.
          if [ -f Dockerfile ] && [ -d pkg ]; then
            exit 0
          fi

          # Fallback Dockerfile for tags without Dockerfile or with incompatible COPY pkg lines.
          cat > Dockerfile <<'EOF'
          FROM --platform=$BUILDPLATFORM golang:1.25.5-alpine AS builder
          WORKDIR /src
          COPY . .
          ARG TARGETOS TARGETARCH
          RUN CGO_ENABLED=0 GOOS="$TARGETOS" GOARCH="$TARGETARCH" \
              go build -trimpath -ldflags="-s -w" -o /out/database-mcp-server ./cmd/server/main.go

          FROM alpine:3.21
          RUN apk add --no-cache ca-certificates tzdata
          WORKDIR /app
          COPY --from=builder /out/database-mcp-server /usr/local/bin/database-mcp-server
          ENTRYPOINT ["/usr/local/bin/database-mcp-server"]
          EOF

          cat > .dockerignore <<'EOF'
          .git
          .github
          .kilocode
          .claude
          -old-.opencode
          tmp
          log
          coverage.out
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image tag list
        id: image
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
          VERSION: ${{ steps.tag.outputs.version }}
          VERSION_NO_V: ${{ steps.tag.outputs.version_no_v }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          echo "name=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:$VERSION"
            echo "$IMAGE_NAME:$VERSION_NO_V"
            if [ "$EVENT_NAME" = "push" ] || [ "$PUBLISH_LATEST" = "true" ]; then
              echo "$IMAGE_NAME:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push GHCR image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.title=Database MCP Server
            org.opencontainers.image.description=Model Context Protocol provider for SQL databases
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ steps.git.outputs.sha }}
