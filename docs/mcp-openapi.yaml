openapi: 3.0.0
info:
  title: Database MCP Provider API
  version: "1.6.3"
  description: |
    OpenAPI documentation for all MCP tools exposed by the Database MCP Provider.
    This enables LLMs and clients to discover and use all available actions programmatically.
servers:
  - url: http://localhost/
  - url: http://localhost:8080/docs/
paths:
  /configure-profile:
    post:
      summary: Create or update a database connection profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureProfileParams'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /list-profiles:
    get:
      summary: List all configured database profiles
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProfilesResult'
  /execute-sql:
    post:
      summary: Execute an arbitrary SQL query or statement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteSQLParams'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteSQLResult'
  /list-tables:
    get:
      summary: List all tables in the selected database
      parameters:
        - in: query
          name: profile_name
          schema:
            type: string
          required: true
        - in: query
          name: database_name
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTablesResult'
  /list-tools:
    post:
      summary: List all available MCP tools
      description: Returns a list of all available MCP tools/actions with their names and descriptions for programmatic discovery
      operationId: list-tools
      tags:
        - Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListToolsParams'
      responses:
        '200':
          description: List of available tools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListToolsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /describe-table:
    get:
      summary: Describe the columns and types of a table
      parameters:
        - in: query
          name: profile_name
          schema:
            type: string
          required: true
        - in: query
          name: table_name
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeTableResult'
  /list-databases:
    get:
      summary: List all databases/schemas available to the profile
      parameters:
        - in: query
          name: profile_name
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDatabasesResult'
  /smart-query-builder:
   post:
     summary: Generate optimized SQL from high-level intent and schema analysis
     description: |
       Takes a natural language intent and generates appropriate SQL by analyzing database schema.
       Uses keyword matching to select relevant tables and columns.
     requestBody:
       required: true
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/SmartQueryBuilderParams'
     responses:
       '200':
         description: Success
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/SmartQueryBuilderResult'
       '400':
         description: Error - No table matches intent
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ErrorResponse'

  /analyze-schema:
   post:
     summary: Perform comprehensive schema analysis
     description: |
       Analyzes database schema at BASIC, DETAILED, or COMPREHENSIVE level.
       Returns metadata, relationships, data quality metrics, and query suggestions.
     requestBody:
       required: true
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/AnalyzeSchemaParams'
     responses:
       '200':
         description: Success
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/AnalyzeSchemaResult'
       '400':
         description: Error - Invalid parameters
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ErrorResponse'
  /track-schema-changes:
   post:
     summary: Track schema snapshots, migration plans, and drift
     description: |
       Tracks schema evolution with four operations:
       - track (default): capture and persist a snapshot, compare with previous snapshot
       - history: list stored snapshots
       - generate_migration: build migration SQL between two snapshots
       - detect_drift: compare live schema with baseline snapshot
     requestBody:
       required: true
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/TrackSchemaChangesParams'
     responses:
       '200':
         description: Success
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/TrackSchemaChangesResult'
       '400':
         description: Error - Invalid parameters
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ErrorResponse'
  /federated-query:
   post:
     summary: Execute read-only SQL across multiple database profiles
     description: |
       Runs explicit subqueries or parsed federated SQL across profiles, then joins and aggregates results.
       Supports INNER/LEFT/RIGHT/FULL joins, partial failures, and final limit/offset.
     requestBody:
       required: true
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/FederatedQueryRequest'
     responses:
       '200':
         description: Success
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/FederatedQueryResult'
       '400':
         description: Error - Invalid federated request
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ErrorResponse'
  /list-schemas:
    post:
      summary: List all accessible database schemas with default schema
      description: |
        Returns a list of all schemas accessible to the profile and identifies the default schema.
        For SQLite, always returns ["main"] with default "main".
        For PostgreSQL, queries information_schema.schemata.
        For MySQL/MariaDB, returns databases accessible to the user.
      operationId: list-schemas
      tags:
        - Schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListSchemasParams'
      responses:
        '200':
          description: List of schemas with default
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSchemasResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /get-search-path:
    post:
      summary: Get the current search_path and effective schema
      description: |
        Queries the database to show the current search_path setting and the active schema.
        Note: This server uses connection pooling. Schema should be explicitly qualified in queries.
      operationId: get-search-path
      tags:
        - Schema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSearchPathParams'
      responses:
        '200':
          description: Search path and current schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSearchPathResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /optimize-query:
    post:
      summary: Run EXPLAIN and return optimization findings for a SQL statement
      description: |
        Analyzes a SQL statement's execution plan and returns optimization findings
        including missing indexes, inefficient joins, and estimated improvement range.
      operationId: optimize-query
      tags:
        - Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptimizeQueryParams'
      responses:
        '200':
          description: Optimization analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OptimizeQueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /validate-query:
    post:
      summary: Validate SQL syntax and detect risky patterns without executing
      description: |
        Validates SQL syntax and detects risky patterns without executing the statement.
        Returns validation issues (syntax, logic, security) and pass/fail summary.
      operationId: validate-query
      tags:
        - Query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateQueryParams'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateQueryResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /analyze-data-lineage:
    post:
      summary: Trace data dependencies for a table using foreign key relationships
      description: |
        Traces upstream and downstream table dependencies using foreign key relationships.
        Returns dependency graph and edges showing data flow.
      operationId: analyze-data-lineage
      tags:
        - Analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeDataLineageParams'
      responses:
        '200':
          description: Lineage analysis result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeDataLineageResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /discover-insights:
    post:
      summary: Discover KPIs, trends, anomalies, and distribution patterns in tables
      description: |
        Automatically discovers KPIs, trends, anomalies, and distribution patterns
        in database tables. Supports filtering by columns and insight types.
      operationId: discover-insights
      tags:
        - Analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverInsightsParams'
      responses:
        '200':
          description: Discovered insights
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverInsightsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /discover-joins:
    post:
      summary: Discover joinable relationships between tables and suggest JOIN SQL
      description: |
        Discovers foreign key relationships between tables and suggests JOIN SQL statements.
        Can target specific tables or discover across all tables in the database.
      operationId: discover-joins
      tags:
        - Analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverJoinsParams'
      responses:
        '200':
          description: Join suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverJoinsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sample-data:
    post:
      summary: Fetch sample rows from a table to infer data types and value ranges
      description: |
        Fetches sample rows from a table to help AI/agents infer data types, formats,
        and value ranges. Returns column names and sample values.
      operationId: sample-data
      tags:
        - Data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SampleDataParams'
      responses:
        '200':
          description: Sample data rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SampleDataResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /mcp-info:
    post:
      summary: Show MCP provider version and author
      description: |
        Returns the MCP provider version, author, and supported capabilities.
        No parameters required.
      operationId: mcp-info
      tags:
        - Meta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MCPInfoParams'
      responses:
        '200':
          description: MCP provider info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MCPInfoResult'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /get-tool-help:
    post:
      summary: Get usage help, examples, and common errors for a specific tool
      description: |
        Returns detailed help for a specific MCP tool including description,
        parameters, examples, common errors, and usage notes.
      operationId: get-tool-help
      tags:
        - Meta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetToolHelpParams'
      responses:
        '200':
          description: Tool help information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetToolHelpResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    ConfigureProfileParams:
      type: object
      properties:
        profile_name:
          type: string
        db_type:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        database_name:
          type: string
        readonly:
          type: boolean
    ListProfilesResult:
      type: object
      properties:
        profiles:
          type: array
          items:
            type: object
            properties:
              profile_name:
                type: string
              db_type:
                type: string
    ExecuteSQLParams:
      type: object
      required:
        - profile_name
        - database_name
        - sql
      properties:
        profile_name:
          type: string
        sql:
          type: string
        database_name:
          type: string
        params:
          type: array
          description: Positional parameters for prepared statements. BLOB/BINARY values must be base64-encoded strings.
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
    ExecuteSQLResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        affected:
          type: integer
    ListTablesResult:
      type: object
      properties:
        tables:
          type: array
          items:
            type: string
    ListToolsParams:
      type: object
      description: Parameters for listing available tools (no parameters required)
      properties: {}
    ListToolsResult:
      type: object
      required:
        - tools
      properties:
        tools:
          type: array
          description: Array of available tools
          items:
            $ref: '#/components/schemas/ToolInfo'
    ToolInfo:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          description: Name of the tool/action
          example: "list-profiles"
        description:
          type: string
          description: Description of what the tool does
          example: "List all configured database profiles"
    DescribeTableResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              nullable:
                type: boolean
              key:
                type: string
    ListDatabasesResult:
      type: object
      properties:
        databases:
          type: array
          items:
            type: string
    SmartQueryBuilderParams:
      type: object
      required:
        - profile_name
        - intent
      properties:
        profile_name:
          type: string
          description: Name of the database profile to use
        intent:
          type: string
          description: High-level intent or description in natural language
          example: "attendance dashboard"
        database_name:
          type: string
          description: Optional database name override
        table_names:
          type: array
          items:
            type: string
          description: Optional specific table names to consider
    SmartQueryBuilderResult:
     type: object
     properties:
       sql:
         type: string
         description: Generated SQL query
         example: "SELECT id, name, date FROM attendance;"
       explanation:
         type: string
         description: Explanation of how the query was generated
         example: "Selected table 'attendance' based on keywords from intent 'attendance dashboard'."
   
    AnalyzeSchemaParams:
     type: object
     required:
       - profile_name
       - analysis_level
     properties:
       profile_name:
         type: string
         description: Name of the database profile to use
       analysis_level:
         type: string
         enum: ["basic", "detailed", "comprehensive"]
         description: Level of analysis to perform
       database_name:
         type: string
         description: Optional database name override
       include_tables:
         type: array
         items:
           type: string
         description: Specific tables to analyze (all if empty)
       exclude_tables:
         type: array
         items:
           type: string
         description: Tables to exclude from analysis
       sample_size:
         type: integer
         description: Number of sample rows to fetch per table
         default: 10
       include_queries:
         type: boolean
         description: Whether to include AI-generated query suggestions
         default: true
       profiling:
         type: boolean
         description: Enable advanced profiling output (column statistics, pattern detection, and quality scores)
         default: false

    AnalyzeSchemaResult:
     type: object
     properties:
       analysis_metadata:
         type: object
         properties:
           analysis_level:
             type: string
           database_type:
             type: string
           analysis_timestamp:
             type: string
             format: date-time
       database_overview:
         type: object
         properties:
           total_tables:
             type: integer
           total_columns:
             type: integer
       table_schemas:
         type: object
         additionalProperties:
           $ref: '#/components/schemas/TableSchema'
       relationship_graph:
         type: object
         properties:
           foreign_keys:
             type: array
             items:
               $ref: '#/components/schemas/ForeignKey'
       ai_query_suggestions:
         type: object
         properties:
           data_exploration:
             type: array
             items:
               $ref: '#/components/schemas/QuerySuggestion'
           business_intelligence:
             type: array
             items:
               $ref: '#/components/schemas/QuerySuggestion'
       column_profiling:
         $ref: '#/components/schemas/EnhancedSchemaAnalysis'

    TrackSchemaChangesParams:
     type: object
     required:
       - profile_name
     properties:
       profile_name:
         type: string
       database_name:
         type: string
       operation:
         type: string
         enum: ["track", "history", "generate_migration", "detect_drift"]
       dialect:
         type: string
       from_snapshot_id:
         type: string
       to_snapshot_id:
         type: string
       snapshot_id:
         type: string
       limit:
         type: integer
       retention_days:
         type: integer

    TrackSchemaChangesResult:
     type: object
     properties:
       operation:
         type: string
       profile_name:
         type: string
       database_name:
         type: string
       from_snapshot_id:
         type: string
       to_snapshot_id:
         type: string
       snapshot_id:
         type: string
       previous_snapshot_id:
         type: string
       changes:
         type: array
         items:
           type: object
           properties:
             type:
               type: string
             table:
               type: string
             column:
               type: string
             impact:
               type: string
       summary:
         type: string

    FederatedQueryRequest:
     type: object
     properties:
       sql:
         type: string
         description: Optional federated SQL using profile.table references
       sub_queries:
         type: array
         items:
           $ref: '#/components/schemas/SubQuery'
       joins:
         type: array
         items:
           $ref: '#/components/schemas/JoinCondition'
       aggregations:
         type: array
         items:
           $ref: '#/components/schemas/Aggregation'
       limit:
         type: integer
       offset:
         type: integer
       max_concurrency:
         type: integer

    SubQuery:
     type: object
     required:
       - profile
       - sql
       - alias
     properties:
       profile:
         type: string
       sql:
         type: string
       alias:
         type: string

    JoinCondition:
     type: object
     required:
       - left
       - right
     properties:
       left:
         type: string
         description: Left expression (alias.column)
       right:
         type: string
         description: Right expression (alias.column)
       type:
         type: string
         enum: ["INNER", "LEFT", "RIGHT", "FULL"]

    Aggregation:
     type: object
     required:
       - function
     properties:
       function:
         type: string
         enum: ["COUNT", "SUM", "AVG", "MIN", "MAX"]
       column:
         type: string
       alias:
         type: string
       group_by:
         type: array
         items:
           type: string

    FederatedQueryResult:
     type: object
     properties:
       columns:
         type: array
         items:
           type: string
       rows:
         type: array
         items:
           type: array
           items: {}
       metadata:
         $ref: '#/components/schemas/FederationMetadata'

    FederationMetadata:
     type: object
     properties:
       execution_time_ms:
         type: integer
       rows_from_each:
         type: object
         additionalProperties:
           type: integer
       errors:
         type: array
         items:
           $ref: '#/components/schemas/FederationError'

    FederationError:
     type: object
     properties:
       profile:
         type: string
       alias:
         type: string
       code:
         type: string
       message:
         type: string

    TableSchema:
     type: object
     properties:
       column_count:
         type: integer
       key_columns:
         type: object
         properties:
           primary_key:
             type: string
           foreign_keys:
             type: array
             items:
               type: string
       columns:
         type: array
         items:
           type: object
           properties:
             column_name:
               type: string
             data_type:
               type: string
             is_nullable:
               type: boolean
             is_primary_key:
               type: boolean
             is_foreign_key:
               type: boolean
             foreign_key_ref:
               type: object
               properties:
                 ref_table:
                   type: string
                 ref_column:
                   type: string

    ForeignKey:
     type: object
     properties:
       from_table:
         type: string
       from_column:
         type: string
       to_table:
         type: string
       to_column:
         type: string
       relationship_type:
         type: string
       suggested_join:
         type: string

    QuerySuggestion:
     type: object
     properties:
       question:
         type: string
       sql:
         type: string

    EnhancedSchemaAnalysis:
     type: object
     properties:
       enabled:
         type: boolean
       max_workers:
         type: integer
       profiled_at:
         type: string
         format: date-time
       table_profiles:
         type: array
         items:
           $ref: '#/components/schemas/TableProfile'

    TableProfile:
     type: object
     properties:
       table_name:
         type: string
       sample_row_count:
         type: integer
       columns:
         type: array
         items:
           $ref: '#/components/schemas/ColumnProfile'

    ColumnProfile:
     type: object
     properties:
       column_name:
         type: string
       data_type:
         type: string
       statistics:
         $ref: '#/components/schemas/ColumnStatistics'
       patterns:
         type: array
         items:
           $ref: '#/components/schemas/PatternMatch'
       quality_score:
         type: number
       quality_metrics:
         $ref: '#/components/schemas/DataQualityMetrics'

    ColumnStatistics:
     type: object
     properties:
       count:
         type: integer
       null_count:
         type: integer
       unique_count:
         type: integer
       min: {}
       max: {}
       mean:
         type: number
       median:
         type: number
       std_dev:
         type: number

    PatternMatch:
     type: object
     properties:
       pattern:
         type: string
       regex:
         type: string
       coverage:
         type: number
       example:
         type: string

    DataQualityMetrics:
     type: object
     properties:
       completeness:
         type: number
       uniqueness:
         type: number
       validity:
         type: number
       consistency:
         type: number

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: "error"
        error_code:
          type: string
          example: "NO_TABLE_MATCH"
        message:
          type: string
          example: "No table found matching the intent for query generation. Available tables: users, reports, logs."

    ListSchemasParams:
      type: object
      required:
        - profile_name
        - database_name
      properties:
        profile_name:
          type: string
          description: Name of the database profile to use
        database_name:
          type: string
          description: Database name to list schemas for

    ListSchemasResult:
      type: object
      properties:
        schemas:
          type: array
          items:
            type: string
          description: List of accessible schema names
        default_schema:
          type: string
          description: Default schema name for the database

    GetSearchPathParams:
      type: object
      required:
        - profile_name
        - database_name
      properties:
        profile_name:
          type: string
          description: Name of the database profile to use
        database_name:
          type: string
          description: Database name to query search path for

    GetSearchPathResult:
      type: object
      properties:
        search_path:
          type: string
          description: Current search_path setting
        current_schema:
          type: string
          description: Effective current schema
        connection_pooling_warning:
          type: string
          description: Warning about connection pooling and schema qualification

    OptimizeQueryParams:
      type: object
      required:
        - profile_name
        - database_name
        - sql
      properties:
        profile_name:
          type: string
          description: Name of the database profile to use
        database_name:
          type: string
          description: Database name to run EXPLAIN against
        sql:
          type: string
          description: SQL statement to optimize
        params:
          type: array
          description: Positional parameters for prepared statements. BLOB/BINARY values must be base64-encoded strings.
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"

    OptimizeQueryResult:
      type: object
      properties:
        plan:
          $ref: '#/components/schemas/ExplainPlan'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/OptimizationFinding'
        estimation:
          $ref: '#/components/schemas/PerformanceEstimation'
        summary:
          type: string

    ExplainPlan:
      type: object
      properties:
        db_type:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PlanStep'
        raw_json:
          type: string
          description: Raw JSON execution plan when available
        notes:
          type: array
          items:
            type: string

    PlanStep:
      type: object
      properties:
        operation:
          type: string
        target:
          type: string
        detail:
          type: string
        estimated_cost:
          type: number
        estimated_rows:
          type: number

    OptimizationFinding:
      type: object
      properties:
        rule:
          type: string
        severity:
          type: string
          enum: ["info", "warn", "critical"]
        message:
          type: string
        suggestion:
          type: string

    PerformanceEstimation:
      type: object
      properties:
        baseline_cost:
          type: number
        baseline_rows:
          type: number
        confidence:
          type: number
        improvement:
          $ref: '#/components/schemas/ImprovementRange'
        suggestions:
          type: array
          items:
            type: string

    ImprovementRange:
      type: object
      properties:
        lower_percent:
          type: number
        upper_percent:
          type: number
        confidence:
          type: number
        explanation:
          type: string

    ValidateQueryParams:
      type: object
      required:
        - profile_name
        - sql
      properties:
        profile_name:
          type: string
          description: Name of the database profile to use
        sql:
          type: string
          description: SQL statement to validate
        database_name:
          type: string
          description: Optional database name
        params:
          type: array
          description: Positional parameters for prepared statements (metadata only). BLOB/BINARY values must be base64-encoded strings.
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"

    ValidateQueryResult:
      type: object
      properties:
        is_valid:
          type: boolean
        issues:
          type: array
          items:
            $ref: '#/components/schemas/ValidationIssue'
        summary:
          type: string
        sql:
          type: string
        profile_name:
          type: string
        database_name:
          type: string

    ValidationIssue:
      type: object
      properties:
        rule:
          type: string
        severity:
          type: string
          enum: ["info", "warn", "error"]
        message:
          type: string
        suggestion:
          type: string

    AnalyzeDataLineageParams:
      type: object
      required:
        - profile_name
        - table_name
      properties:
        profile_name:
          type: string
          description: Name of the database profile to use
        database_name:
          type: string
          description: Optional database name override
        table_name:
          type: string
          description: Table to trace lineage for
        scope:
          type: string
          enum: ["upstream", "downstream", "both"]
          description: Scope of lineage tracing
        tables:
          type: array
          items:
            type: string
          description: Specific tables to include

    AnalyzeDataLineageResult:
      type: object
      properties:
        upstream:
          type: array
          items:
            type: string
          description: Tables upstream from the target
        downstream:
          type: array
          items:
            type: string
          description: Tables downstream from the target
        edges:
          type: array
          items:
            $ref: '#/components/schemas/LineageEdge'
        summary:
          type: string
        scope:
          type: string
        target:
          type: string
        graph:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    LineageEdge:
      type: object
      properties:
        from_table:
          type: string
        to_table:
          type: string
        from_column:
          type: string
        to_column:
          type: string
        constraint:
          type: string

    DiscoverInsightsParams:
      type: object
      required:
        - profile_name
        - table_name
      properties:
        profile_name:
          type: string
          description: Name of the database profile to use
        table_name:
          type: string
          description: Table to discover insights for
        columns:
          type: array
          items:
            type: string
          description: Specific columns to analyze (all if empty)
        insight_types:
          type: array
          items:
            type: string
            enum: ["kpi", "trend", "anomaly", "distribution"]
          description: Types of insights to discover
        max_results:
          type: integer
          description: Maximum number of results to return

    DiscoverInsightsResult:
      type: object
      properties:
        table_name:
          type: string
        insights:
          type: array
          items:
            $ref: '#/components/schemas/Insight'
        summary:
          $ref: '#/components/schemas/InsightsSummary'

    Insight:
      type: object
      properties:
        type:
          type: string
          enum: ["kpi", "trend", "anomaly", "distribution"]
        column:
          type: string
        description:
          type: string
        kpi:
          $ref: '#/components/schemas/KPIInsight'
        trend:
          $ref: '#/components/schemas/TrendInsight'
        anomaly:
          $ref: '#/components/schemas/AnomalyInsight'
        distribution:
          $ref: '#/components/schemas/DistributionInsight'

    KPIInsight:
      type: object
      properties:
        name:
          type: string
        value:
          type: number
        unit:
          type: string
        benchmark:
          type: number

    TrendInsight:
      type: object
      properties:
        direction:
          type: string
          enum: ["upward", "downward", "stable"]
        slope:
          type: number
        confidence:
          type: number

    AnomalyInsight:
      type: object
      properties:
        column:
          type: string
        expected:
          type: number
        actual:
          type: number
        severity:
          type: string
          enum: ["low", "medium", "high", "critical"]

    DistributionInsight:
      type: object
      properties:
        column:
          type: string
        type:
          type: string
          enum: ["normal", "uniform", "skewed", "bimodal"]
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/DistributionBucket'
        stats:
          $ref: '#/components/schemas/DistributionStats'

    DistributionBucket:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        count:
          type: integer

    DistributionStats:
      type: object
      properties:
        mean:
          type: number
        median:
          type: number
        std_dev:
          type: number
        skewness:
          type: number
        kurtosis:
          type: number

    InsightsSummary:
      type: object
      properties:
        total_insights:
          type: integer
        by_type:
          type: object
          additionalProperties:
            type: integer
        high_priority:
          type: integer

    DiscoverJoinsParams:
      type: object
      required:
        - profile_name
      properties:
        profile_name:
          type: string
          description: Name of the database profile to use
        tables:
          type: array
          items:
            type: string
          description: Specific tables to discover joins for (all if empty)

    DiscoverJoinsResult:
      type: object
      properties:
        joins:
          type: array
          items:
            $ref: '#/components/schemas/JoinSuggestion'
        summary:
          type: string

    JoinSuggestion:
      type: object
      properties:
        from_table:
          type: string
        from_column:
          type: string
        to_table:
          type: string
        to_column:
          type: string
        relationship:
          type: string
        suggested_join_sql:
          type: string

    SampleDataParams:
      type: object
      required:
        - profile_name
        - database_name
        - table_name
      properties:
        profile_name:
          type: string
          description: Name of the database profile to use
        database_name:
          type: string
          description: Database name where the table resides
        table_name:
          type: string
          description: Table to sample data from
        schema:
          type: string
          description: Optional schema name (uses default if empty)
        sample_size:
          type: integer
          description: "Number of sample rows to fetch (default: 3)"
          default: 3

    SampleDataResult:
      type: object
      properties:
        table_name:
          type: string
        sample_size:
          type: integer
        columns:
          type: array
          items:
            type: string
        sample_rows:
          type: array
          items:
            type: array
            items: {}
        summary:
          type: string

    MCPInfoParams:
      type: object
      description: Parameters for MCP info (no parameters required)
      properties: {}

    MCPInfoResult:
      type: object
      properties:
        version:
          type: string
          description: MCP provider version
        author:
          type: string
          description: MCP provider author
        model_info:
          type: string
          description: Supported model information
        tool_count:
          type: integer
          description: Number of registered tools
        capabilities:
          type: array
          items:
            type: string
          description: List of MCP capabilities

    GetToolHelpParams:
      type: object
      required:
        - tool_name
      properties:
        tool_name:
          type: string
          description: Name of the tool to get help for
        topic:
          type: string
          description: Optional topic filter (e.g., "parameters", "errors", "all")

    GetToolHelpResult:
      type: object
      properties:
        tool_name:
          type: string
        found:
          type: boolean
        description:
          type: string
        summary:
          type: string
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/ToolParamInfo'
        minimal_example:
          type: object
          additionalProperties: {}
        advanced_example:
          type: object
          additionalProperties: {}
        common_errors:
          type: array
          items:
            $ref: '#/components/schemas/ToolHelpError'
        notes:
          type: array
          items:
            type: string
        response_format:
          type: string
        topics:
          type: array
          items:
            type: string

    ToolParamInfo:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        description:
          type: string
        enum:
          type: array
          items:
            type: string
        default:
          type: string

    ToolHelpError:
      type: object
      properties:
        error:
          type: string
        cause:
          type: string
        fix:
          type: string

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
