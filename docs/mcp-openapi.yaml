openapi: 3.0.0
info:
  title: Database MCP Provider API
  version: "1.0.0"
  description: |
    OpenAPI documentation for all MCP tools exposed by the Database MCP Provider.
    This enables LLMs and clients to discover and use all available actions programmatically.
servers:
  - url: http://localhost/
  - url: http://localhost:8080/docs/
paths:
  /configure-profile:
    post:
      summary: Create or update a database connection profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureProfileParams'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /list-profiles:
    get:
      summary: List all configured database profiles
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListProfilesResult'
  /execute-sql:
    post:
      summary: Execute an arbitrary SQL query or statement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteSQLParams'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecuteSQLResult'
  /list-tables:
    get:
      summary: List all tables in the selected database
      parameters:
        - in: query
          name: profile_name
          schema:
            type: string
          required: true
        - in: query
          name: database_name
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTablesResult'
  /list-tools:
    post:
      summary: List all available MCP tools
      description: Returns a list of all available MCP tools/actions with their names and descriptions for programmatic discovery
      operationId: list-tools
      tags:
        - Tools
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListToolsParams'
      responses:
        '200':
          description: List of available tools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListToolsResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /describe-table:
    get:
      summary: Describe the columns and types of a table
      parameters:
        - in: query
          name: profile_name
          schema:
            type: string
          required: true
        - in: query
          name: table_name
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DescribeTableResult'
  /list-databases:
    get:
      summary: List all databases/schemas available to the profile
      parameters:
        - in: query
          name: profile_name
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListDatabasesResult'
 /smart-query-builder:
   post:
     summary: Generate optimized SQL from high-level intent and schema analysis
     description: |
       Takes a natural language intent and generates appropriate SQL by analyzing database schema.
       Uses keyword matching to select relevant tables and columns.
     requestBody:
       required: true
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/SmartQueryBuilderParams'
     responses:
       '200':
         description: Success
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/SmartQueryBuilderResult'
       '400':
         description: Error - No table matches intent
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ErrorResponse'

 /analyze-schema:
   post:
     summary: Perform comprehensive schema analysis
     description: |
       Analyzes database schema at BASIC, DETAILED, or COMPREHENSIVE level.
       Returns metadata, relationships, data quality metrics, and query suggestions.
     requestBody:
       required: true
       content:
         application/json:
           schema:
             $ref: '#/components/schemas/AnalyzeSchemaParams'
     responses:
       '200':
         description: Success
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/AnalyzeSchemaResult'
       '400':
         description: Error - Invalid parameters
         content:
           application/json:
             schema:
               $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ConfigureProfileParams:
      type: object
      properties:
        profile_name:
          type: string
        db_type:
          type: string
        host:
          type: string
        port:
          type: integer
        username:
          type: string
        password:
          type: string
        database_name:
          type: string
        readonly:
          type: boolean
    ListProfilesResult:
      type: object
      properties:
        profiles:
          type: array
          items:
            type: object
            properties:
              profile_name:
                type: string
              db_type:
                type: string
    ExecuteSQLParams:
      type: object
      required:
        - profile_name
        - database_name
        - sql
      properties:
        profile_name:
          type: string
        sql:
          type: string
        database_name:
          type: string
        params:
          type: array
          description: Positional parameters for prepared statements. BLOB/BINARY values must be base64-encoded strings.
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
              - type: "null"
    ExecuteSQLResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
            items: {}
        affected:
          type: integer
    ListTablesResult:
      type: object
      properties:
        tables:
          type: array
          items:
            type: string
    ListToolsParams:
      type: object
      description: Parameters for listing available tools (no parameters required)
      properties: {}
    ListToolsResult:
      type: object
      required:
        - tools
      properties:
        tools:
          type: array
          description: Array of available tools
          items:
            $ref: '#/components/schemas/ToolInfo'
    ToolInfo:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
          description: Name of the tool/action
          example: "list-profiles"
        description:
          type: string
          description: Description of what the tool does
          example: "List all configured database profiles"
    DescribeTableResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              nullable:
                type: boolean
              key:
                type: string
    ListDatabasesResult:
      type: object
      properties:
        databases:
          type: array
          items:
            type: string
    SmartQueryBuilderParams:
      type: object
      required:
        - profile_name
        - intent
      properties:
        profile_name:
          type: string
          description: Name of the database profile to use
        intent:
          type: string
          description: High-level intent or description in natural language
          example: "attendance dashboard"
        database_name:
          type: string
          description: Optional database name override
        table_names:
          type: array
          items:
            type: string
          description: Optional specific table names to consider
   SmartQueryBuilderResult:
     type: object
     properties:
       sql:
         type: string
         description: Generated SQL query
         example: "SELECT id, name, date FROM attendance;"
       explanation:
         type: string
         description: Explanation of how the query was generated
         example: "Selected table 'attendance' based on keywords from intent 'attendance dashboard'."
   
   AnalyzeSchemaParams:
     type: object
     required:
       - profile_name
       - analysis_level
     properties:
       profile_name:
         type: string
         description: Name of the database profile to use
       analysis_level:
         type: string
         enum: ["basic", "detailed", "comprehensive"]
         description: Level of analysis to perform
       database_name:
         type: string
         description: Optional database name override
       include_tables:
         type: array
         items:
           type: string
         description: Specific tables to analyze (all if empty)
       exclude_tables:
         type: array
         items:
           type: string
         description: Tables to exclude from analysis
       sample_size:
         type: integer
         description: Number of sample rows to fetch per table
         default: 10
       include_queries:
         type: boolean
         description: Whether to include AI-generated query suggestions
         default: true

   AnalyzeSchemaResult:
     type: object
     properties:
       analysis_metadata:
         type: object
         properties:
           analysis_level:
             type: string
           database_type:
             type: string
           analysis_timestamp:
             type: string
             format: date-time
       database_overview:
         type: object
         properties:
           total_tables:
             type: integer
           total_columns:
             type: integer
       table_schemas:
         type: object
         additionalProperties:
           $ref: '#/components/schemas/TableSchema'
       relationship_graph:
         type: object
         properties:
           foreign_keys:
             type: array
             items:
               $ref: '#/components/schemas/ForeignKey'
       ai_query_suggestions:
         type: object
         properties:
           data_exploration:
             type: array
             items:
               $ref: '#/components/schemas/QuerySuggestion'
           business_intelligence:
             type: array
             items:
               $ref: '#/components/schemas/QuerySuggestion'

   TableSchema:
     type: object
     properties:
       column_count:
         type: integer
       key_columns:
         type: object
         properties:
           primary_key:
             type: string
           foreign_keys:
             type: array
             items:
               type: string
       columns:
         type: array
         items:
           type: object
           properties:
             column_name:
               type: string
             data_type:
               type: string
             is_nullable:
               type: boolean
             is_primary_key:
               type: boolean
             is_foreign_key:
               type: boolean
             foreign_key_ref:
               type: object
               properties:
                 ref_table:
                   type: string
                 ref_column:
                   type: string

   ForeignKey:
     type: object
     properties:
       from_table:
         type: string
       from_column:
         type: string
       to_table:
         type: string
       to_column:
         type: string
       relationship_type:
         type: string
       suggested_join:
         type: string

   QuerySuggestion:
     type: object
     properties:
       question:
         type: string
       sql:
         type: string

   ErrorResponse:
     type: object
     properties:
       status:
         type: string
         example: "error"
       error_code:
         type: string
         example: "NO_TABLE_MATCH"
       message:
         type: string
         example: "No table found matching the intent for query generation. Available tables: users, reports, logs."
# [2025-08-02] CHANGE: describe-table now requires both database_name and table_name as input parameters.
# The profile's default database is ignored for this operation.
# [2025-08-04] ADDED: smart-query-builder tool for generating SQL from natural language intent.
# [2025-08-04] CHANGE: database_name is now a required parameter for execute-sql, list-tables, and sample-data actions.
