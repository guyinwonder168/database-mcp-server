# SonarCloud Configuration
# Project identification
sonar.projectKey=guyinwonder168_database-mcp-server
sonar.organization=guyinwonder168

# Project name and version
sonar.projectName=Database MCP Server
sonar.projectVersion=1.0.4

# Project description
sonar.projectDescription=A production-ready Model Context Protocol (MCP) provider for SQL databases

# Source code location
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/*.pb.go

# Test code location
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage report
sonar.go.coverage.reportPaths=coverage.out

# Language
sonar.language=go

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Additional Go-specific settings
sonar.go.tests.reportPaths=report.json

# Ignore generated code and vendor
sonar.coverage.exclusions=**/vendor/**,**/testdata/**

# Duplication settings
sonar.cpd.exclusions=**/*_test.go,**/vendor/**

# Issue exclusions (if any patterns need to be ignored)
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=
# sonar.issue.ignore.multicriteria.e1.resourceKey=
