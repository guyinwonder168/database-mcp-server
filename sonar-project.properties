# SonarCloud Configuration
# Project identification
sonar.projectKey=guyinwonder168_database-mcp-server
sonar.organization=guyinwonder168

# Project name and version
sonar.projectName=Database MCP Server
sonar.projectVersion=1.1.1

# Project description
sonar.projectDescription=A production-ready Model Context Protocol (MCP) provider for SQL databases

# Source code location
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/*.pb.go

# Test code location
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Coverage report
sonar.go.coverage.reportPaths=coverage.out

# Language
sonar.language=go

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Additional Go-specific settings
sonar.go.tests.reportPaths=report.json

# Ignore generated code and vendor, and hard-to-test packages
sonar.coverage.exclusions=**/vendor/**,**/testdata/**,cmd/server/*.go,internal/config/*.go,internal/db/*.go,internal/log/*.go

# Duplication settings
sonar.cpd.exclusions=**/*_test.go,**/vendor/**

# Issue exclusions (if any patterns need to be ignored)
sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e1.resourceKey=internal/mcp/server.go
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e2.resourceKey=internal/mcp/helpers.go
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e3.resourceKey=internal/mcp/insights_handler.go
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S2077
sonar.issue.ignore.multicriteria.e4.resourceKey=internal/mcp/schema_snapshot_types.go
