# config.yaml template for Database MCP Provider

max_pool_size: 10

# AES key for password encryption (must be exactly 32 characters)
aes_key: "<your-32-char-aes-key>"

profiles:
  - profile_name: example_postgres
    db_type: postgres
    host: localhost
    port: 5432
    username: myuser
    password: <encrypted>
    database_name: mydb
    readonly: false

  - profile_name: example_mysql
    db_type: mysql
    host: localhost
    port: 3306
    username: myuser
    password: <encrypted>
    database_name: mydb
    readonly: true

  - profile_name: example_sqlite
    db_type: sqlite
    database_name: ./mydb.sqlite
    readonly: false